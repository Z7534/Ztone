      max-warps: 2          # +2 (jetzt 5)
      chest-rows: 1          # +1 (jetzt 4 Reihen)
      icon: COPPER_BLOCK
      colors: ["&b", "&e"]   # Aqua, Yellow
      gradient-unlocked: true

