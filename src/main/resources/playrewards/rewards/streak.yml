# ==============================================================================
# PlayReward - Tägliche Login-Streak Belohnungen
# Streak-Reset: Wenn ein Tag ohne Login vergeht (sofern kein Streak-Saver greift).
# Wöchentlicher Saver-Reset: Montags um 00:00 Uhr (Europe/Berlin).
# Schlangenlinien-Weg (19 Slots pro Seite):
# Start oben links -> ganz runter -> 2 nach rechts -> ganz hoch -> 2 nach rechts -> ganz runter -> 2 nach rechts -> ganz hoch!
# Automatische Paginierung auf Seite 2 ab 20 Belohnungen!
# Icons: Basic-Kopf (Holztruhe), Besonderer Kopf (Goldener Stern), Epischer Kopf (Krone)
# Bereits eingelöste Belohnungen erhalten automatisch den grünen Haken-Kopf!
# ==============================================================================

