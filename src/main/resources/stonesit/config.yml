# ==============================================================================
#                          STONESIT KONFIGURATION
# ==============================================================================
# Hochperformantes Sit-, Pose- (/lay, /legsup) & PlayerSit-Modul (1:1 nach GSit).
# Ohne Bellyflop, Spin und Toggle-Overhead; mit Admin-Schutz vor Sneak-Abwurf.
# ==============================================================================

options:
  # Spieler stehen automatisch auf, wenn sie Schaden erleiden
  get-up-damage: false

  # Spieler können durch Sneaken (Schleichen) aufstehen
  get-up-sneak: true

  # Spieler beim Aufstehen an ihre ursprüngliche Position zurücksetzen
  get-up-return: false

  # Spieler stehen automatisch auf, wenn der Block unter ihnen abgebaut/zerstört wird
  get-up-break: true

  # Erlaubt das Sitzen/Liegen an unsicheren Positionen (z. B. wenn der Block darüber nicht frei ist)
  allow-unsafe: false

  # Erlaubt mehreren Spielern gleichzeitig auf demselben Block zu sitzen/liegen
  same-block-rest: false

  # Zentriert den Spieler beim Sitzen/Liegen auf der Blockmitte
  center-block: true

  # Zeigt beim Hinsetzen/Hinlegen eine ActionBar-Information an
  custom-message: true

  # ============================================================================
  #                           BLOCK-SIT EINSTELLUNGEN
  # ============================================================================
  sit:
    # Materialien oder Block-Tags (#...), auf die man sich per Rechtsklick setzen kann.
    # Optionaler Höhen-Offset mit ';' trennbar (z.B. "oak_stairs;0.1")
    sit-materials:
      - "#stairs"
      - "#slabs"
      - "#carpets"
      - "#wool_carpets"
      - "moss_carpet"
      - "pale_moss_carpet"
      - "shelf_mushroom"
      - "snow"

    # Sitzen auf Stufen (Slabs) und Treppen (Stairs) nur erlauben, wenn sie unten platziert sind
    bottom-part-only: true

    # Erfordert eine leere Haupthand, um sich per Rechtsklick hinzusetzen
    empty-hand-only: true

    # Maximale Distanz zum Block für Rechtsklick-Sitzen (0.0 = unbegrenzt / Standard-Reichweite)
    max-distance: 0.0

  # ============================================================================
  #                      POSE EINSTELLUNGEN (/lay & /legsup)
  # ============================================================================
  pose:
    # Erlaubt liegenden Spielern, mit der Welt zu interagieren (Blöcke/Entities schlagen etc.)
    interact: false

    # Setzt den Phantom-Timer (TIME_SINCE_REST) beim Hinlegen zurück (wie beim Schlafen im Bett)
    lay-rest: true

    # Spielt Schnarchgeräusche ab, während ein Spieler liegt
    lay-snoring-sounds: false

    # Schnarchgeräusche nur nachts abspielen
    lay-snoring-night-only: true

    # Zählt liegende Spieler (/lay & /legsup) als schlafend im Bett zum Überspringen der Nacht/Gewitter,
    # OHNE dabei jemals den Respawn-Punkt des Spielers zu setzen oder zu verändern!
    lay-night-skip: true

    # Lässt liegende Spieler morgens nach dem Überspringen der Nacht automatisch aufstehen (wie im Bett)
    lay-wakeup-morning: true

  # ============================================================================
  #                         SPIELER-SIT (PLAYERSIT)
  # ============================================================================
  player-sit:
    # Erlaubt Spielern, sich per Rechtsklick auf andere Spieler zu setzen (Stapeln)
    allow-sit: true

    # Erlaubt Spielern, sich per Rechtsklick auf NPCs zu setzen
    allow-sit-npc: true

    # Maximale Anzahl an gestapelten Spielern (0 = unbegrenzt)
    max-stack: 0

    # Wirft auf dem Kopf sitzende Spieler beim Sneaken (Schleichen) ab
    # HINWEIS: Admins mit der Permission 'stonesit.bypass.sneakeject' (oder 'stonesit.admin')
    # können durch Sneaken NICHT vom Kopf geworfen werden!
    sneak-ejects: true

    # Setzt den Spieler beim Absteigen an die Position des untersten Spielers im Stapel
    bottom-return: false

    # Erfordert eine leere Haupthand, um sich auf andere Spieler zu setzen
    empty-hand-only: true

    # Maximale Distanz zum Zielspieler für PlayerSit (0.0 = unbegrenzt)
    max-distance: 0.0

  # ============================================================================
  #                         WELTEN, REGIONEN & FILTER
  # ============================================================================
  # Erlaubt das Sitzen/Liegen auf geclaimten Grundstücken nur für getrustete Spieler (Ztone Claims)
  trusted-region-only: false

  # Welten, in denen das Sitzen/Liegen deaktiviert ist
  world-blacklist: []

  # Wenn nicht leer, ist das Sitzen/Liegen NUR in diesen Welten erlaubt
  world-whitelist: []

  # Materialien oder Block-Tags, auf denen man sich niemals hinsetzen/hinlegen kann
  material-blacklist: []

  # Befehle, die während des Sitzens/Liegens blockiert sind (ohne Bypass-Permission)
  command-blacklist:
    - "skin"
    - "nick"

# ==============================================================================
#                                 NACHRICHTEN
# ==============================================================================
