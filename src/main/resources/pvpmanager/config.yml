General Settings:
  # Changes the language, to see all options use '/pmr locale' ingame
  Locale: DE
  # Player instantly respawns after death (MC 1.8.8+)
  # HINWEIS: Verwende hierfür stattdessen die Vanilla Gamerule '/gamerule doImmediateRespawn true',
  # um Thread-Livelocks bei Parallel World Ticking (Leaf/SparklyPaper) zu verhindern.
  Auto Respawn: false
  # If true all deaths while combat tagged are considered PvP deaths since the player is fighting someone
  Deaths While Tagged Count PvP: true
  # Controls if the plugin will use teams, needed for changing nametags and some other things, disable if there are conflicts with other plugins
  Use Scoreboard Teams: true
  # List of worlds where PvPManager will have no effect
  World Exclusions:
    - 'example'

######################
####  Combat Tag  ####
######################
Combat Tag:
  Enabled: true
  # How long should the combat tag last in seconds
  Time: 50
  # Sets the player glowing while tagged, for MC 1.9+
  Glowing: true
  # Will untag the player when they kill their current enemies
  Untag On Kill: true
  # Allow players to tag themselves with a bow, enderpearl, etc
  Self Tag: false
  # If enabled, will retag the player when they throw an enderpearl
  EnderPearl Renews Tag: true
  # If enabled, will retag the player when they use a wind charge
  WindCharge Renews Tag: true

  # Commands executed as the player when tagged, this allows for huge customization, {player} is the tagged player
  Commands On Tag:
    - '!CONSOLE examplecommand'
    - '!PLAYER examplecommand'
  Commands On Untag:
    - '!CONSOLE examplecommand'
    - '!PLAYER examplecommand'
  # Name of regions where players will not get tagged
  WorldGuard Exclusions:
    - 'example'

  Display:
    # Adds a prefix or suffix while the player is in combat
    Nametags:
      Enabled: true
      # Choose the player's nametag prefix while tagged, '&c' would just color their name red
      # The TAB plugin is required to use placeholders in the nametag
      Prefix: '&4⚔ &8(&7%pvpmanager_combat_timeleft%s&8) &c'
      Suffix: ' &f%pvpmanager_player_health%&c❤'
    Action Bar:
      Enabled: true
      # You can use any PlaceholderAPI placeholders here
      Message: '&8[&c&lᴄᴏᴍʙᴀᴛ&8] &7<time>ꜱ &8• &a<barsLeft>&#AA5555<barsPassed> &8• &7%pvpmanager_current_enemy% &8(&c%pvpmanager_current_enemy_health%❤&8)'
      # Symbol to use for the progress bar and how many times to repeat it. Other symbols ▉,▍,▎,▏,|
      Symbol: '▉'
      Total Bars: 20
    Boss Bar:
      Enabled: true
      # You can use any PlaceholderAPI placeholders here
      Message: '&8&l[&c&lᴄᴏᴍʙᴀᴛ&8&l] &e&l<time> ꜱᴇᴋᴜɴᴅᴇɴ'
      # See here for bar color options - https://hub.spigotmc.org/javadocs/spigot/org/bukkit/boss/BarColor.html
      BarColor: RED
      # See here for bar style options - https://hub.spigotmc.org/javadocs/spigot/org/bukkit/boss/BarStyle.html
      BarStyle: SOLID

  # Section is self-explanatory, what actions to block in combat
  Actions Blocked:
    EnderPearls: false
    ChorusFruits: false
    Teleport: true
    Riptide: false
    Eat: false
    Totem of Undying: false
    Place Blocks: false
    Break Blocks: false
    Open Inventory: false
    Enter Portal: false
    Elytra:
      # Prevents players from gliding with elytra while in combat, will unequip elytra if players spam glide
      Block Gliding: false
      # Prevents players from using firework rockets while gliding in combat
      Block Fireworks: false
    Interact:
      Enabled: false
      # List of materials to block interaction, adding DOOR means all materials that end with DOOR like IRON_DOOR and so on
      List:
        - 'DOOR'
        - 'FENCE_GATE'
        - 'BUTTON'
        - 'BED'
        - 'PRESSURE_PLATE'
        - 'SLAB'
        - 'STAIRS'
        - 'CARPET'
    # Command whitelist is recursive, allowing 'tell' will allow 'tell' with any number of arguments
    Commands:
      Enabled: true
      Whitelist: true
      Command List:
        - 'msg'
        - 'r'

##################################
####  Combat Log Punishments  ####
##################################
Combat Log Punishments:
  # Money lost on combat log, you can use less or equal to 1 for percentages like 0.05 for 5%, 1 for 100% (0 to disable)
  Money Penalty: 0.0
  # Lightning strike settings for combat log
  Lightning Strike:
    Enabled: true
    # Number of lightning bolts to strike (be careful with high numbers as it can cause lag)
    Count: 10
    # Color of lightning (BLUE, RED, GREEN, YELLOW, PURPLE, WHITE, ORANGE)
    Color: RED
  # Should the player be killed and, if so, what will the player drop
  Kill on Logout:
    Enabled: true
    Player Drops:
      Inventory: true
      Experience: true
      Armor: true
  # Punish the player even if he gets kicked by other plugins or by an admin
  Punish On Kick:
    Enabled: true
    # If Match Kick Reason is enabled, the punishment will be applied only if the kick reason matches the list below
    Match Kick Reason: false
    Kick Reasons:
      - 'CombatLogging'
  # List of commands to execute on combat log, use '{player}' for player name
  # The 'announce' command can be optionally used to broadcast, you can add more or to disable just delete the command
  Commands On Combat Log:
    - 'announce {prefix} &r{player} &cʜᴀᴛ ᴠᴇʀꜱᴜᴄʜᴛ ᴅᴇᴍ ᴋᴀᴍᴘꜰ ᴢᴜ ᴇɴᴛᴋᴏᴍᴍᴇɴ!'
    - 'lban {player} Ban-Combatlogging'

######################
####  PvP Toggle  ####
######################
# Section for PvP Toggle feature - /pvp or /pvptoggle
PvP Toggle:
  # Leave it at true unless you want no PvP for new players
  Default PvP: false
  # How many seconds until players can use the command again
  Cooldown: 1
  # Displays a particle sphere around the player when he is attacked
  Protection Effect:
    Enabled: true
    Particle: ENCHANT
    Cooldown: 1
  # You have to wait x seconds to actually toggle PvP, to prevent abuses.
  State Cooldown:
    Enabled: false
    Time: 30
    Commands On Cooldown Start:
      - '!CONSOLE examplecommand {player}'
  # What should the player's prefix/suffix be when pvp is on/off
  NameTags:
    Enabled: false
    Prefix On: '&4ᴘᴠᴘ ᴀɴ ⚔ '
    Prefix Off: '&2ᴘᴠᴘ ᴀᴜꜱ ⚔ '
  # Command list to execute on PvP toggle, use '{player}' for player name
  Commands PvP On:
    - 'examplecommand {player} turned pvp on'
  Commands PvP Off:
    - 'examplecommand {player} turned pvp off'
  # PvP Toggle is forcibly enabled on an attack in all regions with WG's pvp flag set to ALLOW
  # If you want it only on specific regions instead, set WorldGuard Overrides to false and use the pvp-protection flag set to DENY
  # NOTE: A region with the pvp flag set to DENY is ALWAYS respected regardless of this setting
  WorldGuard Overrides: true

###############################
####  Anti Border Hopping  ####
###############################
Anti Border Hopping:
  # Makes players still vulnerable to PvP inside safe zones
  Vulnerable:
    Enabled: true
    # Toggles whether combat tagging renews while fighting in a safe zone. Works for WorldGuard only
    Renew Combat Tag: true
  # Generate a block barrier when trying to enter a safezone. Recommended to use together with Push Back enabled
  Barrier:
    Enabled: true
    # Options are FAST or FULL mode, FAST is recommended even though FULL covers more angles
    Mode: FAST
    Material: RED_STAINED_GLASS
    # Distance to check around the player
    Radius: 6
    # How often to update the barrier, default is every 3 ticks = 150ms
    Update Rate: 3
  # Players will be launched back when trying to enter a safe zone
  Push Back:
    Enabled: true
    # How much force for the pushback (Minimum 0.1 and Maximum 4)
    Force: 1.2
    # Block attempts to enter a safe zone with enderpearls while tagged
    Block EnderPearl: true
    # Shows a text hologram when the player gets pushed back (MC 1.19.4+)
    Hologram Display: true
    # Takes elytra from player chest slot and puts it in their inventory
    Remove Elytra: false

#####################
####  Cooldowns  ####
#####################
Item Cooldowns:
  Combat:
    ENCHANTED_GOLDEN_APPLE: 60

########################
####  Player Kills  ####
########################
# Section with settings triggered when a player kills another player
Player Kills:
  # Money won as reward, use less or equal to 1 for percentage like 0.05 for 5%, 1 for 100% (0 to disable)
  Money Reward: 0.0
  # Money lost on PvP death, use less or equal to 1 for percentage like 0.1 for 10%, 1 for 100% (0 to disable)
  Money Penalty: 0.0
  # Should the amount won from money reward be stolen from the dead player
  Money Steal: false
  # Similar to how money steal works, get a percentage of XP from the player you killed, 1 for 100% (0 to disable)
  Exp Steal: 0.0
  Death Effects:
    # Strike lightning when a player dies in PvP, the lightning doesn't make any damage to other players
    Lightning: true
  Commands On Kill:
    # Time in seconds between kill commands, -1 to disable cooldown
    Cooldown: -1
    # Commands to execute on kill ({player} is the killer, {victim} is the victim, {item} is the item material in hand)
    Commands:
      - 'announce {player} ʜᴀᴛ {victim} ᴍɪᴛ {item} ɢᴇᴛÖᴛᴇᴛ'
  # Commands to execute on respawn ({player} is the respawning player)
  Commands On Respawn:
    - 'examplecommand {player} respawned after dying in PvP combat'
  # WorldGuard regions where rewards, penalties and commands will not be executed
  WorldGuard Exclusions:
    - 'exampleregion'
  # Extra Drops - List of items (amount,Material) to drop from a dead player (Like loot drops from monsters)
  Extra Drops: []

  # Prevent player abuse by killing the same player several times to rise in rank or even just grief
  Anti Kill Abuse:
    Enabled: true
    Max Kills: 10
    Time Limit: 30
    # Warn the player 1 kill before they are punished with the commands
    Warn Before: true
    Commands on Abuse:
      - 'kick {player} &cᴋɪʟʟ ᴀʙᴜꜱᴇ ɪꜱᴛ ɴɪᴄʜᴛ ᴇʀʟᴀᴜʙᴛ!'
    # After respawn, how many seconds should players be protected (0 to disable)
    Respawn Protection: 15
    # After teleport, how many seconds should players be protected from all damage (0 to disable)
    Teleport Protection: 0
    # Name of regions where players will not get punished by kill abuse
    WorldGuard Exclusions:
      - 'example'
    Command Cooldown After Death:
      Time: 3
      Commands:
        - 'back'

##########################
####  Other Settings  ####
##########################
Other Settings:
  # Enable blood particles on PvP hits
  PvP Blood: true
  # Ignore hits from snowballs, eggs, fishing rod and others
  Ignore No Damage Hits: true
  # Send protection messages (PvP disabled, newbie protection, etc.) to action bar instead of chat
  Protection Messages to Action Bar: true
  # Player Drop Mode -> What happens to a player's drops and exp on death ('ALWAYS', 'DROP', 'KEEP', 'CLEAR')
  Player Drop Mode: ALWAYS
  # Show player health, uses scoreboards so might conflict with other plugins
  Show health under name:
    Enabled: true
    Display Name: '&c❤'
  Auto Soup:
    # How much health does soup heal, use 0 to disable
    Health: 0
  # Removes specified items like empty potion bottles and milk buckets after consumption
  Recycling:
    Enabled: false
    List:
      - BUCKET
      - GLASS_BOTTLE
      - BOWL

# What should be disabled when a player enters PvP
Disable On Hit:
  Fly: true
  # Whether to restore flight after combat ends
  Restore Fly: true
  # Anything not Survival gets disabled
  GameMode: true
  Disguise: false
  GodMode: false
  Elytra: false
  Invisibility: false

# PlaceholderAPI boolean formatting
Placeholders:
  Boolean Format:
    True: '#6fc93eᴘᴠᴘ ✓'
    False: '#c9453eᴘᴠᴘ ✗'

# Potions considered harmful, players will be tagged by them and protected from them
Harmful Potions:
  - SLOW
  - SLOWNESS
  - SLOW_DIGGING
  - MINING_FATIGUE
  - CONFUSION
  - NAUSEA
  - BLINDNESS
  - HUNGER
  - WEAKNESS
  - POISON
  - WITHER
  - GLOWING
  - LEVITATION
  - UNLUCK
  - BAD_OMEN
  - INFESTED

Debug Mode: false

DimensionSettings:
  minecraft:overworld:
    enabled: false
    forced: false
  minecraft:the_nether:
    enabled: false
    forced: false
  minecraft:the_end:
    enabled: false
    forced: false
  minecraft:shopwelt:
    enabled: true
    forced: true
