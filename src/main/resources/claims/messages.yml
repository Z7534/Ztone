# =========================================================
#  Claims - Nachrichten
# =========================================================
#
# Unterstützt normales MiniMessage: <green>, <bold>, <#RRGGBB>, usw.
# https://docs.advntr.dev/minimessage/format.html
#
# Zusätzlich gibt es ein eigenes Kurzformat für Farbverläufe (Gradients)
# zwischen zwei Farben:
#
#   <#FARBE1>Text</#FARBE2>
