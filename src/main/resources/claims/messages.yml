bypass-enabled: "<green>ᴄʟᴀɪᴍ-ʙʏᴘᴀꜱꜱ ᴀᴋᴛɪᴠɪᴇʀᴛ. ᴅᴜ ᴋᴀɴɴꜱᴛ ᴊᴇᴛᴢᴛ ꜱᴄʜᴜᴛᴢ-, ᴛʀᴜꜱᴛ- ᴜɴᴅ ʙᴀɴɴ-ʀᴇɢᴇʟɴ ᴜᴍɢᴇʜᴇɴ. ᴇʀ ᴡɪʀᴅ ʙᴇɪᴍ ᴠᴇʀʟᴀꜱꜱᴇɴ ᴅᴇꜱ ꜱᴇʀᴠᴇʀꜱ ᴀᴜᴛᴏᴍᴀᴛɪꜱᴄʜ ᴢᴜʀüᴄᴋɢᴇꜱᴇᴛᴢᴛ. ᴍɪᴛ /ꜱᴛᴀꜰꜰᴄʟᴀɪᴍ ʙʏᴘᴀꜱꜱ ꜱᴄʜᴀʟᴛᴇꜱᴛ ᴅᴜ ɪʜɴ ᴡɪᴇᴅᴇʀ ᴀᴜꜱ."
bypass-disabled: "<red>ᴄʟᴀɪᴍ-ʙʏᴘᴀꜱꜱ ᴅᴇᴀᴋᴛɪᴠɪᴇʀᴛ."
bypass-usage: "<red>ᴠᴇʀᴡᴇɴᴅᴜɴɢ: /ꜱᴛᴀꜰꜰᴄʟᴀɪᴍ ʙʏᴘᴀꜱꜱ [ᴏɴ|ᴏꜰꜰ]"
cannot-ban-owner: "<red>ᴅᴇʀ ʙᴇꜱɪᴛᴢᴇʀ ᴇɪɴᴇꜱ ᴄʟᴀɪᴍꜱ ᴋᴀɴɴ ɴɪᴄʜᴛ ɢᴇʙᴀɴɴᴛ ᴡᴇʀᴅᴇɴ."
